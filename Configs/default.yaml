# PriTiGAN default config (Section 5)

training:
  iterations: 10000
  seed: 42
  train_ratio: 0.70

architecture:
  hidden_dim: 24
  num_layers: 3
  gamma: 1                  # discriminator loss weight
  lambda1: 10                # reconstruction loss weight
  lambda2: 0.1                # supervised loss weight

privacy:
  delta: 1.0e-5
  num_microbatches: 1

datasets:
  stock:
    seq_len: 24
    n_features: 6
    batch_size: 128
    learning_rate: 5.0e-4
    noise_multiplier: 90.0  # eps ~= 1
    l2_norm_clip: 1.5

  energy:
    seq_len: 24
    n_features: 28
    batch_size: 128
    learning_rate: 5.0e-4
    noise_multiplier: 1.0   # eps ~= 6
    l2_norm_clip: 1.0

  mba:
    seq_len: 56
    # only 2 of the raw CSV's 5 columns are numeric -- see
    # pritigan/data.py DATASET_CONFIG['mba'] for details
    n_features: 2
    batch_size: 100
    learning_rate: 5.0e-4
    noise_multiplier: 0.8   # eps ~= 4
    l2_norm_clip: 1.0

evaluation:
  n_mia_runs: 5
  mia_member_size: 500
  n_mc_samples: 1000
  n_pca_components: 5
  classification_epochs: 250
  regression_epochs: 250
